plugin: s-hdf5

with-variants:
  native-serial:
    packages:
      - os@-hdf5-dev
      - os@-hdf5-tools
    env:
      - set-var HDF5_LIB $(get-os-lib-dir serial/libhdf5.so)
      - set-var HDF5_LIBRARIES $(get-os-lib serial/libhdf5.so);$(get-os-lib serial/libhdf5_cpp.so)
      - set-var HDF5_INC $(get-os-inc-dir serial/hdf5.h)
      - set-var HDF5_ROOT_DIR /usr
      - set-var HDF5_ROOT $HDF5_LIB
      - set-var HDF5_DIR $HDF5_LIB
      - add-to-var HDF5_INCLUDE_DIRS $HDF5_INC
      - add-to-var HDF5_INCLUDE_DIR $HDF5_INC
      - set-var HDF5_BIN /usr/bin
      - add-to-var C_INCLUDE_PATH $HDF5_INC
      - add-to-var CPLUS_INCLUDE_PATH $HDF5_INC
      - add-to-var LIBRARY_PATH $HDF5_LIB
  native-mpi:
    packages:
      - os@-hdf5-dev
      - os@-hdf5-tools
      - os@-hdf5-openmpi-dev
      - os@-openmpi-dev
    env:
      - set-var HDF5_LIB $(get-os-lib-dir openmpi/libhdf5.so)
      - set-var HDF5_LIBRARIES $(get-os-lib openmpi/libhdf5.so);$(get-os-lib openmpi/libhdf5_cpp.so)
      - set-var HDF5_INC $(get-os-inc-dir openmpi/hdf5.h)
      - set-var HDF5_ROOT_DIR /usr
      - set-var HDF5_ROOT $HDF5_LIB
      - set-var HDF5_DIR $HDF5_LIB
      - add-to-var HDF5_INCLUDE_DIRS $HDF5_INC
      - add-to-var HDF5_INCLUDE_DIR $HDF5_INC
      - set-var HDF5_BIN /usr/bin
      - set-var HDF5_PREFER_PARALLEL true
      - add-to-var C_INCLUDE_PATH $HDF5_INC
      - add-to-var CPLUS_INCLUDE_PATH $HDF5_INC
      - add-to-var LIBRARY_PATH $HDF5_LIB
  native:
    packages:
      - os@-hdf5-dev:[v]
      - os@-hdf5-tools:[v]
    env:
      - set-var HDF5_LIB $(get-os-lib-dir serial/libhdf5.so)
      - set-var HDF5_LIBRARIES $(get-os-lib serial/libhdf5.so);$(get-os-lib serial/libhdf5_cpp.so)
      - set-var HDF5_INC $(get-os-inc-dir serial/hdf5.h)
      - set-var HDF5_ROOT_DIR /usr
      - set-var HDF5_ROOT $HDF5_LIB
      - set-var HDF5_DIR $HDF5_LIB
      - add-to-var HDF5_INCLUDE_DIRS $HDF5_INC
      - add-to-var HDF5_INCLUDE_DIR $HDF5_INC
      - set-var HDF5_BIN /usr/bin
      - add-to-var C_INCLUDE_PATH $HDF5_INC
      - add-to-var CPLUS_INCLUDE_PATH $HDF5_INC
      - add-to-var LIBRARY_PATH $HDF5_LIB

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://bitbucket.hdfgroup.org/scm/hdffv/hdf5.git

archive:
  proxy: default
  options: none
  protocol: ftp
  url: ftp://anonymous@ftp.cea.fr/pub/salome/prerequisites
  file: hdf5-$VERSION.tar.gz

patches:
  mingw:
    - hdf5-1.10.6.msys2.patch

depends:
  common:
    - os@-zlib1g-dev
  mpi:
    - s-openmpi

build-depends:
  common:
    - if not enabled(no-doc): os@-sphinx-common
    - if not enabled(no-doc): os@-sphinx-intl
    - s-cmake
  mingw:
    - os@-gfortran

env:
  - set-var HDF5_ROOT_DIR $PREFIX
  - set-var HDF5_ROOT $PREFIX
  - add-to-var HDF5_INC $PREFIX/include
  - add-to-var HDF5_LIB $PREFIX/lib
  - add-to-var HDF5_BIN $PREFIX/bin
  - set-var HDF5_DIR $PREFIX/lib
  - set-var HDF5_LIBRARIES $PREFIX/lib/libhdf5.so;$PREFIX/lib/libhdf5_cpp.so
  - add-to-var HDF5_INCLUDE_DIRS $PREFIX/include
  - add-to-var HDF5_INCLUDE_DIR $PREFIX/include
  - add-to-var PATH $PREFIX/bin
  - add-to-var C_INCLUDE_PATH $PREFIX/include
  - add-to-var CPLUS_INCLUDE_PATH $PREFIX/include
  - add-to-var LIBRARY_PATH $PREFIX/lib
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib
  - add-to-var CMAKE_PREFIX_PATH $PREFIX/cmake

config-options:
  common:
    - -DCMAKE_INSTALL_PREFIX=$PREFIX
    - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)
    - -DHDF5_BUILD_HL_LIB=ON
    - -DHDF5_BUILD_CPP_LIB=ON
    - -DBUILD_SHARED_LIBS=ON
    - -DHDF5_ENABLE_Z_LIB_SUPPORT=ON
    - -DHDF5_ALLOW_EXTERNAL_SUPPORT=ON
  mingw:
    - -DCMAKE_DLL_NAME_WITH_SOVERSION=ON
    - -DBUILD_TESTING=ON
    - -DCMAKE_SKIP_RPATH=ON
    - -DHDF5_BUILD_CPP_LIB=ON
    - -DHDF5_BUILD_FORTRAN=ON
    - -DHDF5_ENABLE_SZIP_SUPPORT=OFF
    - -DHDF5_INSTALL_CMAKE_DIR=lib/cmake
    - -DHDF5_INSTALL_DATA_DIR=share/doc/hdf5
  mpi:
    - -DHDF5_ENABLE_PARALLEL=ON
    - -DCMAKE_CXX_COMPILER=$(command-path mpicxx)
    - -DCMAKE_C_COMPILER=$(command-path mpicc)
    - -DHDF5_BUILD_JAVA:BOOL=OFF
    - -DHDF5_ENABLE_THREADSAFE:BOOL=OFF
    - -DHDF5_BUILD_TOOLS=ON
  permissive:
    - -DCMAKE_C_FLAGS=-Wno-incompatible-pointer-types -Wno-implicit-function-declaration
    - -DCMAKE_CXX_FLAGS=-Wno-incompatible-pointer-types -Wno-implicit-function-declaration
    - -DALLOW_UNSUPPORTED=ON

config:
  _: |-
    OPTIONS =
    OPTIONS = config-options
    cmake $OPTIONS ../src
  mingw: |-
    OPTIONS =
    OPTIONS = config-options
    CFLAGS="$CFLAGS -Wno-implicit-function-declaration" cmake $OPTIONS ../src

build:
  _: make -j$SCBI_JOBS
  mingw: cmake --build . -j$SCBI_JOBS

install:
  _: make install
  mingw: cmake --install .

prefix: NONE
