plugin: s-openturns-fftw

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/openturns/otfftw.git

archive:
  proxy: default
  options: none
  protocol: ftp
  url: ftp://anonymous@ftp.cea.fr/pub/salome/prerequisites
  file: openturns-${VERSION%|*}.tar.gz
  dir: otfftw-${VERSION#*|}

depends:
  - os@-python3
  - os@-fftw3-dev
  - s-openturns

build-depends:
  - os@-python3-sphinx
  - s-cmake
  - s-swig

env:
  - set-var OTFFTW_HOME $PREFIX
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages

config-options:
  - -DCMAKE_INSTALL_PREFIX=$PREFIX
  - -DPython_EXECUTABLE=$(command-path python$PYTHON_VERSION)
  - -DPython3_EXECUTABLE=$(command-path python$PYTHON_VERSION)
  - -DCMAKE_FIND_ROOT_PATH=ON
  - -DSWIG_DIR:FILEPATH=$(output swig -swiglib)
  - -DSWIG_EXECUTABLE:PATH=$(command-path swig)
  - -DCMAKE_SKIP_INSTALL_RPATH:BOOL=ON
  - -DBUILD_DOC=OFF

config: |-
  OPTIONS = config-options
  cmake $OPTIONS ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
