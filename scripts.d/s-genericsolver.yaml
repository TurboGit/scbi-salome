plugin: s-genericsolver

functions:
  s-genericsolver-salome-module:
    run: echo GENERICSOLVER

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://git.salome-platform.org/gitpub/samples/genericsolver

depends:
  - s-salome-kernel
  - s-salome-gui

build-depends:
  - s-cmake
  - s-swig
  - s-salome-configuration

env:
  - set-var GENERICSOLVER_INSTALL_DIR $PREFIX

config: cmake -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release) ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
