plugin: s-irmb

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/gcherchi/InteractiveAndRobustMeshBooleans

env:
  - add-to-var PATH $PREFIX/bin
  - add-to-var C_INCLUDE_PATH $PREFIX/include
  - add-to-var CPLUS_INCLUDE_PATH $PREFIX/include

config: cmake -DCMAKE_INSTALL_PREFIX=$PREFIX ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
