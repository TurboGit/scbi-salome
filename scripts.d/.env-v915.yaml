#  Environment file .env-v915 (YAML version)

vars:
  #  the Python version without the micro version (3.12)
  PYTHON_VERSION: '$(output python3 -c "import sys; print(''%d.%d'' % sys.version_info[:2])")'
  SCBI_CLANG_VERSION: ${SCBI_CLANG_VERSION:-12}
  SCBI_ROOT: ${SCBI_ROOT:-$HOME/dev}
  SCBI_BDIR: ${SCBI_BDIR:-$SCBI_ROOT/build-salome-v915}
  SCBI_GIT_REPO: ${SCBI_GIT_REPO:-$HOME/dev/git}
  SCBI_PLAN: ${SCBI_PLAN:-v915/mpi}
  SALOME_PREREQUIS_VERSION: ${SALOME_PREREQUIS_VERSION:-9.15.0}
