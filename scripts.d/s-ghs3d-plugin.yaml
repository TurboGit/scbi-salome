plugin: s-ghs3d-plugin

functions:
  s-ghs3d-plugin-ctest-dir:
    params:
      - PREFIX
    run: echo $PREFIX/bin/salome/test
  s-ghs3d-plugin-salome-module:
    run: echo GHS3DPLUGIN

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/ghs3dplugin

depends:
  default:
    - s-salome-kernel
    - s-salome-bootstrap
    - s-salome-gui
    - s-geom
    - s-smesh

build-depends:
  common:
    - s-salome-configuration
    - s-cmake
    - os@-sphinx-common

env:
  - set-var GHS3DPLUGIN_ROOT_DIR $PREFIX
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages/salome
  - add-to-var SMESH_MeshersList GHS3DPlugin
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/ghs3dplugin

config-options:
  common:
    - -DCMAKE_INSTALL_PREFIX=$PREFIX
    - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)
    - if enabled(cmake-debug): -DSALOME_CMAKE_DEBUG=ON
    - if enabled(no-doc): -DSALOME_BUILD_DOC=OFF
  mpi:
    - -DCMAKE_CXX_COMPILER=$(get-os-bin mpicxx)

config: |-
  OPTIONS = config-options
  cmake $OPTIONS ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
