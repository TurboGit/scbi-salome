#  Environment file .env-v916 (YAML version)

inherit: [shared]

vars:
  #  the Python version without the micro version (3.12)
  PYTHON_VERSION: '$(output python3 -c "import sys; print(''%d.%d'' % sys.version_info[:2])")'
  SCBI_CLANG_VERSION: ${SCBI_CLANG_VERSION:-16}
  SCBI_ROOT: ${SCBI_ROOT:-$HOME/dev}
  SCBI_BDIR: ${SCBI_BDIR:-$SCBI_ROOT/build-salome-v916}
  SCBI_GIT_REPO: ${SCBI_GIT_REPO:-$HOME/dev/git}
  SCBI_PLAN: ${SCBI_PLAN:-v916/mpi}
  SALOME_PREREQUIS_VERSION: ${SALOME_PREREQUIS_VERSION:-9.16.0}
