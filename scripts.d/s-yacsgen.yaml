plugin: s-yacsgen

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/yacsgen

env:
  - set-var YACSGEN_ROOT_DIR $PREFIX
  - add-to-var PATH $PREFIX/script
  - add-to-var PYTHONPATH $PREFIX/bin
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages

install: mkdir ../install && cd ../install && mkdir bin && mkdir share && mkdir -p lib/python$PYTHON_VERSION/site-packages && copy ../src/script/* bin/ && copy ../src/Examples share/ && copy ../src/module_generator lib/python$PYTHON_VERSION/site-packages

post-install: sed -i "s#__YACSGEN_INSTALL_PATH__#${BDIR/install}#" $PREFIX/share/Examples/exec.sh
