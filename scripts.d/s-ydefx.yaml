plugin: s-ydefx

functions:
  s-ydefx-ctest-dir:
    params:
      - PREFIX
    run: echo $PREFIX/bin/salome/test
  s-ydefx-salome-module:
    run: echo YDEFX

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/ydefx

depends:
  common:
    - s-salome-configuration
  default:
    - s-py2cpp
    - s-qt
    - s-salome-kernel
    - s-yacs

build-depends:
  common:
    - s-cmake

env:
  - set-var YDEFX_ROOT_DIR $PREFIX
  - add-to-var CMAKE_PREFIX_PATH $PREFIX/salome_adm/cmake_files
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages
  - add-to-var PYTHONPATH $PREFIX/lib/salome

config: |-
  _S1 = command-path python$PYTHON_VERSION
  cmake -DCMAKE_INSTALL_PREFIX=$PREFIX -DPYTHON_EXECUTABLE=$_S1 -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release) ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
