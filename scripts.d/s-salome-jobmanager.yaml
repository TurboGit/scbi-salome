plugin: s-salome-jobmanager

functions:
  s-salome-jobmanager-salome-module:
    run: echo JOBMANAGER

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/jobmanager

depends:
  common:
    - s-salome-configuration
  default:
    - s-salome-kernel
    - s-salome-gui

build-depends:
  common:
    - s-cmake
  default:
    - s-salome-bootstrap

env:
  - set-var JOBMANAGER_ROOT_DIR $PREFIX
  - add-to-var SALOME_MODULES JOBMANAGER
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/jobmanager
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome

config: |-
  CDEBUG = is-enabled cmake-debug
  DISDOC = is-enabled no-doc
  cmake -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release) ${CDEBUG:+-DSALOME_CMAKE_DEBUG=ON} ${DISDOC:+-DSALOME_BUILD_DOC=OFF} ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
