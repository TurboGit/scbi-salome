plugin: s-salome-jobmanager

functions:
  s-salome-jobmanager-salome-module:
    run: echo JOBMANAGER

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/jobmanager

depends:
  common:
    - s-salome-configuration
  default:
    - s-salome-kernel
    - s-salome-gui

build-depends:
  common:
    - s-cmake
  default:
    - s-salome-bootstrap

env:
  - set-var JOBMANAGER_ROOT_DIR $PREFIX
  - add-to-var SALOME_MODULES JOBMANAGER
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/jobmanager
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome

config-options:
  - if enabled(no-doc) -DADAO_BUILD_DOC=OFF
  - if enabled(cmake-debug) -DSALOME_CMAKE_DEBUG=ON
  - -DCMAKE_INSTALL_PREFIX=$PREFIX
  - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)

config: cmake $(config-options) ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
