plugin: s-swig

with-variants:
  native:
    packages:
      - os@-swig:[v]
    env:
      - if empty($MINGW_PREFIX):
          - set-var SWIG_ROOT_DIR /usr
          - set-var SWIG_ROOT /usr

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/swig/swig

archive:
  proxy: default
  options: none
  protocol: ftp
  url: ftp://anonymous@ftp.cea.fr/pub/salome/prerequisites
  file: swig-$VERSION.tar.gz

env:
  common:
    - set-var SWIG_ROOT_DIR $PREFIX
    - set-var SWIG_DIR $PREFIX
    - set-var SWIG_ROOT $PREFIX
    - set-var SWIG_VERSION $(get-version)
    - unset-var SWIG_LIB
    - prepend-to-var PATH $PREFIX/bin
  win:
    - set-var SWIG_LIB $PREFIX/Lib

config: ../src/configure --prefix=$PREFIX --without-pcre --without-octave

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
