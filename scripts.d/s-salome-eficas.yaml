plugin: s-salome-eficas

functions:
  s-salome-eficas-salome-module:
    run: echo EFICAS

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/eficas

depends:
  common:
    - s-salome-configuration
  default:
    - s-omniorb
    - s-qt
    - s-salome-kernel
    - s-salome-gui

build-depends:
  common:
    - s-cmake

env:
  - set-var EFICAS_ROOT_DIR $PREFIX
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages/salome
  - add-to-var SALOME_MODULES EFICAS
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/eficas

config: cmake -DCMAKE_INSTALL_PREFIX=$PREFIX -DSALOME_GUI_BUILD_WITH_QT5=ON -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release) ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
