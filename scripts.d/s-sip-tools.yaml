plugin: s-sip-tools

inherit:
  - from: s-python-post-install-dist-packages
    name: handle-dist

with-variants:
  native:
    packages:
      - os@-sip-dev:[v]
    env:
      - set-var SIP_ROOT_DIR /usr

vcs:
  proxy: default
  options: none
  protocol: hg
  url: https://www.riverbankcomputing.com/hg/sip

archive:
  proxy: default
  options: none
  protocol: ftp
  url: ftp://anonymous@ftp.cea.fr/pub/salome/prerequisites
  file: sip-${VERSION%|*}-PyQt5_sip-${VERSION#*|}.tar.gz
  dir: sip-${VERSION%|*}

patches:
  - if ref =~ 4.19.6: sip-4.19-f_back.patch
  - if ref =~ 4.19.25: sip-4.19.25-f_back.patch

depends:
  - s-python-modules

env:
  - set-var SIP_ROOT_DIR $PREFIX
  - set-var SIPDIR $PREFIX
  - set-var SIP_DIR $PREFIX
  - prepend-to-var PATH $PREFIX/bin
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/python$PYTHON_VERSION/site-packages

build-env:
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages

out-of-tree: false

config: |-
  _S1 = output-words cat ../source-id
  if $_S1 =~ 5.5.:
      :
  else:
      python3 ./configure.py -b ${PREFIX}/bin -d ${PREFIX}/lib/python${PYTHON_VERSION}/site-packages -e ${PREFIX}/include/python${PYTHON_VERSION} -v ${PREFIX}/sip

pre-build: |-
  _S1 = output-words cat ../source-id
  if $_S1 =~ 5.5.:
      :
  else:
      sed -i 's/-fPIC/-fPIC -fpermissive/g' siplib/Makefile

build: |-
  _S1 = output-words cat ../source-id
  if $_S1 =~ 5.5.:
      :
  else:
      make

pre-install: mkdir -p $PREFIX/lib/python$PYTHON_VERSION/site-packages

install: |-
  _S1 = output-words cat ../source-id
  if $_S1 =~ 5.5.:
      pip3 install --ignore-installed . --no-deps --prefix=$PREFIX
  else:
      make install

post-install: |-
  handle-dist-post-install $PREFIX $TARGET
  cd $PREFIX/bin
  if not (is-file(sip5)):
      copy sip-build sip5

prefix: NONE
