plugin: s-hexablock

functions:
  s-hexablock-salome-module:
    run: echo HEXABLOCK

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/hexablock

patches:
  - hexablock950_sci10.patch

depends:
  - s-qt
  - s-geom

build-depends:
  - os@-python3-sphinx
  - os@-python3-sphinx-rtd-theme
  - os@-graphviz-dev
  - os@-doxygen
  - os@-python3-docutils
  - s-cmake
  - s-swig
  - s-salome-configuration
  - s-salome-bootstrap

env:
  - set-var QT5_ROOT_DIR /usr
  - set-var HEXABLOCK_ROOT_DIR $PREFIX
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages
  - add-to-var SALOME_MODULES HEXABLOCK
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/hexablock

config: |-
  CDEBUG = is-enabled cmake-debug
  DISDOC = is-enabled no-doc
  cmake -DCMAKE_INSTALL_PREFIX=$PREFIX -DSALOME_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH=$PREFIX/lib/cmake -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release) ${DISDOC:+-DSALOME_BUILD_DOC=OFF} ${CDEBUG:+-DSALOME_CMAKE_DEBUG=ON} ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
