plugin: s-hexablock-plugin

functions:
  s-hexablock-plugin-salome-module:
    run: echo HEXABLOCKPLUGIN

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/hexablockplugin

depends:
  default:
    - s-qt
    - s-salome-gui
    - s-smesh
    - s-hexablock

build-depends:
  common:
    - s-salome-configuration
    - s-cmake
  default:
    - os@-doxygen
    - os@-graphviz-dev
    - os@-python3-docutils
    - os@-python3-sphinx
    - s-swig
    - s-salome-bootstrap

env:
  - set-var HEXABLOCKPLUGIN_ROOT_DIR $PREFIX
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages/salome
  - add-to-var SMESH_MeshersList HEXABLOCKPlugin
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/hexablock

config-options:
  - if enabled(cmake-debug) -DSALOME_CMAKE_DEBUG=ON
  - -DCMAKE_INSTALL_PREFIX=$PREFIX
  - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)
  - -DSALOME_BUILD_TESTS=OFF
  - -DCMAKE_PREFIX_PATH=$PREFIX/lib/cmake

config: cmake $(config-options) ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
