plugin: s-hello

functions:
  s-hello-salome-module:
    run: echo HELLO

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/hello

depends:
  - s-qt
  - s-salome-kernel
  - s-salome-gui

build-depends:
  - os@-doxygen
  - os@-graphviz
  - os@-graphviz-dev
  - os@-python3-docutils
  - os@-python3-sphinx
  - os@-python3-sphinx-rtd-theme
  - os@-sphinx-common
  - os@-sphinx-intl
  - s-cmake
  - s-swig
  - s-salome-configuration
  - s-salome-bootstrap

env:
  - set-var HELLO_ROOT_DIR $PREFIX
  - add-to-var PATH $PREFIX/bin/salome
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages/salome

config: cmake -DCMAKE_INSTALL_PREFIX=$PREFIX -DKERNEL_ROOT_DIR=$KERNEL_ROOT_DIR -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release) ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
