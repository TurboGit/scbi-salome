plugin: s-salome-gui

functions:
  s-salome-gui-salome-module:
    run: echo GUI

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/gui

depends:
  common:
    - s-salome-configuration
  default:
    - os@-qwt-qt5-dev
    - os@-glu1-mesa-dev
    - s-qt
    - s-pyqt
    - s-paraview
    - s-salome-kernel
    - s-salome-bootstrap
    - s-occt
    - s-hdf5
  mpi:
    - s-openmpi

build-depends:
  common:
    - s-cmake
    - s-python-modules
  _:
    - os@-sphinx-common
    - if not enabled(no-doc): os@-sphinx-intl
    - s-sip
    - s-swig
    - s-salome-bootstrap

env:
  - set-var GUI_ROOT_DIR $PREFIX
  - set-var SalomeGUI_DIR $PREFIX/adm_local/cmake_files
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages/salome
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/gui
  - add-to-var CMAKE_PREFIX_PATH $SalomeGUI_DIR

config-options:
  common:
    - -DCMAKE_INSTALL_PREFIX=$PREFIX
    - -DSALOME_BUILD_TESTS=OFF
    - -DCMAKE_PREFIX_PATH=$PREFIX/lib/cmake
    - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)
    - -DPython_EXECUTABLE=$(command-path python$PYTHON_VERSION)
    - -DPython3_EXECUTABLE=$(command-path python$PYTHON_VERSION)
    - -DSWIG_EXECUTABLE=$SWIG_ROOT_DIR/bin/swig
    - ${DISDOC:+-DSALOME_BUILD_DOC=OFF}
    - ${CDEBUG:+-DSALOME_CMAKE_DEBUG=ON}
  default:
    - -DSALOME_USE_MPI=OFF
  mpi:
    - -DSALOME_USE_MPI=ON

config: |-
  OPTIONS = config-options
  cmake $OPTIONS ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
