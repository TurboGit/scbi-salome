plugin: s-python-post-install-dist-packages

post-install: |-
  if is-dir($PREFIX/local/lib):
      copy $PREFIX/local/* $PREFIX/
      delete-tree $PREFIX/local
  LDIR = $PREFIX/lib/python$PYTHON_VERSION
  if is-dir($LDIR/dist-packages):
      mkdir -p $LDIR/site-packages
      copy $LDIR/dist-packages/* $LDIR/site-packages/.
      delete-tree $LDIR/dist-packages
