plugin: s-salome-bootstrap

functions:
  s-salome-bootstrap-ctest-dir:
    params:
      - PREFIX
    run: echo $PREFIX/__SALOME_EXT__/bin/salome/test/BOOTSTRAP

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/salome_bootstrap

depends:
  common:
    - s-salome-configuration

build-depends:
  common:
    - s-cmake
  default:
    - s-swig

env:
  - set-var SALOMEBOOTSTRAP_ROOT_DIR $PREFIX
  - set-var SALOME_APPLICATION_DIR $PREFIX
  - prepend-to-var PYTHONPATH $PREFIX/__SALOME_BOOTSTRAP__
  - prepend-to-var PYTHONPATH $PREFIX/__RUN_SALOME__/lib/python$PYTHON_VERSION/site-packages
  - prepend-to-var PYTHONPATH $PREFIX/__RUN_SALOME__/bin/salome
  - prepend-to-var PYTHONPATH $PREFIX/__RUN_SALOME__/lib/salome
  - prepend-to-var LD_LIBRARY_PATH $PREFIX/__RUN_SALOME__/lib/salome
  - add-to-var CMAKE_PREFIX_PATH $PREFIX/__RUN_SALOME__/salome_adm/cmake_files

config: cmake -DCMAKE_INSTALL_PREFIX=$PREFIX ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
