#  Environment file .env-win (YAML version)

#  NOTE: the Bash version stopped when the Windows Kit or Visual Studio
#  directory (SCBI_WINDOWS_KIT, SCBI_WINDOWS_VC) was not found: an
#  environment file only sets values, check them by hand.

vars:
  SCBI_WINDOWS_VERSION: 10
  SCBI_WINDOWS_KIT_VERSION: 10
  SCBI_WINDOWS_KIT: C:/Program Files (x86)/Windows Kits/$SCBI_WINDOWS_VERSION
  SCBI_WINDOWS_VC: C:/Program Files/Microsoft Visual Studio/2022/Community/VC/Tools/MSVC/14.37.32822
  SCBI_CLANG_VERSION: 12
  SCBI_ROOT: $HOME/dev
  SCBI_BDIR: $SCBI_ROOT/build-windows
  #  the Python version without the micro version (3.12)
  PYTHON_VERSION: '$(output python3 -c "import sys; print(''%d.%d'' % sys.version_info[:2])")'
  SCBI_GIT_REPO: $HOME/dev/git
  SCBI_PLAN: ng-dev
