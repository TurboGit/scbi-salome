#  Shared environment (YAML version of .env-shared, converted by hand).
#
#  The final step of each module copies its installation into the
#  application of s-salome (EDF/<module>) and writes its environment
#  scripts extra.env.d/NNNN_<module>.sh and .py from the environment
#  actions of the module.

functions:
  module-final-step:
    run: |-
      #  NOTE: the Bash version tested [[ "$(is-enabled application)" = "no" ]]
      #  but is-enabled prints nothing (not "no") for a disabled feature: the
      #  test never returned. Kept as is; to stop when the feature is not
      #  enabled, uncomment:
      #  if not enabled(application):
      #      return

      # 1 - Copy module's artifacts

      #  Nothing to copy for aggregated modules, build dependencies and
      #  meta-modules
      if $IS_AGGREGATED != no or $DEPENDS_KIND != default or $IS_META == yes:
          return

      for SM EVARIANT SK SR in $(module-ref s-salome):
          APPDIR = target-dir s-salome $EVARIANT app

      if is-dir($PREFIX):
          if $IS_UP_TO_DATE == no or not is-dir($APPDIR/EDF/$MODULE):
              mkdir -p $APPDIR/EDF/$MODULE
              rsync -a $PREFIX/. $APPDIR/EDF/$MODULE/.

      # 2 - Setup environment

      ENVD = $APPDIR/extra.env.d
      mkdir -p $ENVD

      CURRENT = replace $MODULE - _

      #  The number of the scripts of the module: its own if present, else
      #  the last one + 1 (0000 is for setup)
      NUM =
      if $MODULE == s-meshgems:
          NUM = 0998
      else:
          for F in $ENVD/*_$CURRENT.sh:
              if empty($NUM) and is-file($F):
                  NUM = $(basename $F)
                  NUM = ${NUM%%_*}
          if empty($NUM):
              LAST = 0
              for F in $ENVD/0[0-8]*:
                  if is-file($F):
                      LAST = $(basename $F)
                      LAST = ${LAST%%_*}
              NUM = output printf %04d $(output expr $LAST + 1)

      SFILE = $ENVD/${NUM}_$CURRENT.sh
      PFILE = $ENVD/${NUM}_$CURRENT.py
      NAME = module-name $MODULE
      MODVAR = ${CURRENT}_ROOT_INSTALL_DIR
      MODROOT = '${'$MODVAR'}'
      EDFROOT = '${ROOT_EDF}'

      write $SFILE:
          # $NAME
          export ROOT_EDF=\${out_dir_Path}/EDF
          export root_dir=\${out_dir_Path}
          $MODVAR=\${ROOT_EDF}/$MODULE
      write $PFILE:
          # $NAME
          import os.path
          def init(context, root_dir):
             ROOT_EDF=os.path.join(root_dir, r"EDF")
             $MODVAR=os.path.join(ROOT_EDF, r"$MODULE")

      #  The indentation of the body of init() (append blocks are dedented)
      IND = "   "

      #  Variables not written to the Python script
      NOTPY = '^(C_INCLUDE_PATH|INCLUDE|LIB|CPLUS_INCLUDE_PATH|CMAKE_.*|.*INCLUDE_DIRS?|LIBRARY_PATH|SCBI_SALOME_BIN_ENV_SECTION)$'
      APPENDED = '^(PV_PLUGIN_PATH|SalomeAppConfig|SMESH_MeshersList|SMESH_PYPLUGIN_DIR)$'

      for A V X in $(env-actions):
          #  Special case, do not add /usr/bin to PATH from native modules.
          #  This PATH will be at the end of the PATH anyway and we do want
          #  to pick other tools compiled first.
          if not empty($X) and not ($V == PATH and $X == /usr/bin):
              #  Compute relative directory
              REL = ${X/$PREFIX/$MODROOT}
              REL = ${REL/$SCBI_BDIR/$EDFROOT}
              RELP = ${X#$PREFIX}
              if $RELP == $X:
                  DVAR = "\"$X\""
              else:
                  DVAR = "os.path.join($MODVAR, r\"${RELP#/}\")"

              #  For shell script. Note that we always append to existing
              #  variables as some may have been set by the binary package's
              #  env_lauch.sh.
              SEP = :
              if $SCBI_IS_WINDOWS == yes and $V != PATH:
                  SEP = ";"
              HELPER =
              if $A == SET or $A == S:
                  append $SFILE:
                      export $V="$REL"
              elif $A == UNSET or $A == U:
                  append $SFILE:
                      unset $V
              elif $A == ADD:
                  HELPER = add-to-var-sep
              elif $A == APPEND or $A == A:
                  HELPER = append-to-var-sep
              elif $A == PREPEND or $A == P:
                  HELPER = prepend-to-var-sep
              elif $A == REMOVE or $A == R:
                  HELPER = remove-from-var-sep
              if not empty($HELPER):
                  append $SFILE:
                      $HELPER $V "$REL" "$SEP"
                      export $V

              #  For Python
              if $A == REMOVE and $V == PATH:
                  append $PFILE:
                      ${IND}context.removeFromPATH(r"$X")
              elif $A == REMOVE:
                  append $PFILE:
                      ${IND}context.removeFromVariable(r"$V", r"$X")
              elif $V =~ $NOTPY:
                  true
              elif $V == PATH:
                  append $PFILE:
                      ${IND}context.addToPath($DVAR)
              elif $V == LD_LIBRARY_PATH:
                  append $PFILE:
                      ${IND}context.addToLdLibraryPath($DVAR)
              elif $V == PYTHONPATH:
                  append $PFILE:
                      ${IND}context.addToPythonPath($DVAR)
              elif $V =~ $APPENDED and $A == PREPEND:
                  append $PFILE:
                      ${IND}context.addToVariable(r"$V", $DVAR)
              elif $V =~ $APPENDED:
                  append $PFILE:
                      ${IND}context.appendVariable(r"$V", $DVAR)
              elif $V == SALOME_MODULES:
                  append $PFILE:
                      ${IND}context.addToVariable("SALOME_MODULES", "$X", separator=",")
              elif $V == PYTHON_VERSION:
                  append $PFILE:
                      ${IND}context.setVariable(r"$V", "$X", overwrite=True)
              else:
                  append $PFILE:
                      ${IND}context.setVariable(r"$V", $DVAR, overwrite=True)

      chmod 755 $SFILE
