#  Environment file .env-debug (YAML version)

vars:
  # Set the global debug flags for all modules.
  # This version is for dev but can be used to any other version
  # as it is mostly a debug temporary env.
  SCBI_s_persalys_BUILD_TYPE: Debug
  SCBI_CLANG_VERSION: 12
  SCBI_ROOT: $HOME/dev
  SCBI_BDIR: $SCBI_ROOT/build-salome-dev
  #  the Python version without the micro version (3.12)
  PYTHON_VERSION: '$(output python3 -c "import sys; print(''%d.%d'' % sys.version_info[:2])")'
  SCBI_GIT_REPO: $HOME/dev/git
  SCBI_PLAN: dev/mpi
