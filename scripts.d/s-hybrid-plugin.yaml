plugin: s-hybrid-plugin

functions:
  s-hybrid-plugin-ctest-dir:
    params:
      - PREFIX
    run: echo $PREFIX/bin/salome/test
  s-hybrid-plugin-salome-module:
    run: echo HYBRIDPLUGIN

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/hybridplugin

depends:
  default:
    - s-salome-kernel
    - s-salome-bootstrap
    - s-salome-gui
    - s-geom
    - s-smesh

build-depends:
  common:
    - s-salome-configuration
    - s-cmake
    - os@-sphinx-common

env:
  - set-var HYBRIDPLUGIN_ROOT_DIR $PREFIX
  - add-to-var PATH $PREFIX/bin/salome
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages/salome
  - add-to-var SMESH_MeshersList HYBRIDPlugin
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/hybridplugin

config-options:
  - if enabled(no-doc) -DADAO_BUILD_DOC=OFF
  - if enabled(cmake-debug) -DSALOME_CMAKE_DEBUG=ON
  - -DCMAKE_INSTALL_PREFIX=$PREFIX
  - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)

config: cmake $(config-options) ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
