plugin: s-paravis

functions:
  s-paravis-ctest-dir:
    params:
      - PREFIX
    run: echo $PREFIX/bin/salome/test
  s-paravis-salome-module:
    run: echo PARAVIS

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/paravis

depends:
  common:
    - s-salome-configuration
  default:
    - s-qt
    - s-salome-bootstrap
    - s-hdf5
    - s-salome-kernel
    - s-salome-gui
    - s-paraview
    - s-med-coupling
    - s-fields
    - s-smesh
  mpi:
    - s-openmpi

build-depends:
  common:
    - s-cmake

env:
  - set-var PARAVIS_ROOT_DIR $PREFIX
  - add-to-var PATH $PREFIX/bin/salome
  - add-to-var PV_PLUGIN_PATH $PREFIX/lib/paraview
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/bin/salome
  - add-to-var PYTHONPATH $PREFIX/lib/salome
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages
  - add-to-var SALOME_MODULES PARAVIS
  - add-to-var SalomeAppConfig $PREFIX/share/salome/resources/paravis

config-options:
  common:
    - -DCMAKE_INSTALL_PREFIX=$PREFIX
    - -DPython_EXECUTABLE=$(command-path python$PYTHON_VERSION)
    - -DPython3_EXECUTABLE=$(command-path python$PYTHON_VERSION)
    - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)
    - -DVTK_DIR=$(last-modified-directory "$PARAVIEW_INSTALL_DIR/lib/cmake/paraview-*")
    - ${CDEBUG:+-DSALOME_CMAKE_DEBUG=ON}
    - ${DISDOC:+-DSALOME_BUILD_DOC=OFF}
    - -DSALOME_PARAVIS_USE_GEOM_SOURCE=ON
    - -DSALOME_PARAVIS_USE_SMESH_SOURCE=ON
  headless:
    - -DPARAVIEW_USE_QT=OFF
    - -DPARAVIEW_HEADLESS=ON
    - -DSALOME_BUILD_DOC=OFF
    - -DSALOME_BUILD_TESTS=OFF
  mpi:
    - -DSALOME_USE_MPI=ON

config: |-
  OPTIONS = config-options
  cmake $OPTIONS ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
