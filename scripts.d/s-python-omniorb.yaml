plugin: s-python-omniorb

inherit:
  - from: s-python-post-install-dist-packages

vcs:
  proxy: default
  options: none
  protocol: svn
  url: https://svn.code.sf.net/p/omniorb/svn
  dir: omniORBpy

archive:
  proxy: default
  options: none
  protocol: ftp
  url: ftp://anonymous@ftp.cea.fr/pub/salome/prerequisites
  file: omniORBpy-$VERSION.tar.gz

patches:
  _:
    - omniorb-noinitfile.patch
    - if ref =~ 4.2.5:
        - omniorbpy-4.2.5.p2.patch
        - omniorbpy-4.2.5.p3.patch
  mingw:
    - omniorbpy-4.2.6-msys2.patch

depends:
  - s-omniorb-core

env:
  _:
    - set-var OMNIORBPY_ROOT_DIR $PREFIX
    - set-var OMNIORBPY_INCLUDE_DIR $PREFIX/include
    - LDIR = $PREFIX/lib/python$PYTHON_VERSION
    - add-to-var PYTHONPATH $LDIR/site-packages
    - add-to-var PYTHONPATH $LDIR/site-packages/omniidl_be
    - add-to-var PYTHONPATH $(dirname $(get-os-bin $LDIR/site-packages/_omnipy*so))
  mingw:
    - set-var OMNIORBPY_ROOT_DIR ${OMNIORB_ROOT_DIR}

post-setup:
  mingw: |-
    OPD = output dirname $PREFIX
    mv $OPD/src $OPD/omniORBpy
    copy ${SCBI_MODULES_DIR[s-omniorb-core@src]} $OPD/src
    mv $OPD/omniORBpy $OPD/src/src/lib

out-of-tree:
  mingw: false

config:
  _: |-
    _S1 = command-path python3
    CXXFLAGS="-fpermissive" ../src/configure --prefix=$PREFIX --with-omniorb=$OMNIORB_ROOT_DIR PYTHON=$_S1
  mingw: true

build:
  _: make -j$SCBI_JOBS
  mingw: |-
    cd src/lib/omniORBpy
    make -j$SCBI_JOBS export

install:
  _: make install
  mingw: |-
    mkdir -p $PREFIX
    copy bin $PREFIX
    copy lib $PREFIX
    copy include $PREFIX

prefix: NONE
