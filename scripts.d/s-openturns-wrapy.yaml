plugin: s-openturns-wrapy

inherit:
  - from: s-python-post-install-dist-packages

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/openturns/otwrapy.git

archive:
  proxy: default
  options: none
  protocol: ftp
  url: ftp://anonymous@ftp.cea.fr/pub/salome/prerequisites
  file: openturns-${VERSION%|*}.tar.gz
  dir: otwrapy-${VERSION#*|}

depends:
  - os@-python3
  - s-openturns

build-depends:
  - os@-python3-pytest-runner
  - os@-python3-setuptools

env:
  - set-var OTWRAPY_HOME $PREFIX
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages

build-env:
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages

out-of-tree: false

install: |-
  PYPIURL = $(store-key PYPIURL)
  mkdir -p $PREFIX/lib/python$PYTHON_VERSION/site-packages
  echo "[easy_install]" > setup.cfg
  echo "index-url = $PYPIURL" >> setup.cfg
  python3 setup.py install --prefix=$PREFIX

prefix: NONE
