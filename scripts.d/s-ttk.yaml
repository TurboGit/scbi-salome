  - -DVTK_MODULE_ENABLE_ttkPointSetToSurface:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkProjectionFromField:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkQuadrangulationSubdivision:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkSignedDistanceField:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkSurfaceGeometrySmoother:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkLDistanceMatrix:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkMatrixToHeatMap:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkMergeTreeClustering:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkMergeTreeDistanceMatrix:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkPersistenceDiagramClustering:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkPersistenceDiagramDistanceMatrix:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkMandatoryCriticalPoints:STRING=YES
