plugin: s-ttk

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/topology-tool-kit/ttk.git

archive:
  proxy: default
  options: none
  protocol: wget
  url: https://github.com/topology-tool-kit/ttk/archive/refs/tags
  file: $VERSION.tar.gz

patches:
  - ttk-enable-torch.patch
  - if ref =~ 1.3: ttk-1.3.0-embree-include.patch

depends:
  - libboost-system-dev
  - libpython3-dev
  - libxt-dev
  - libxcursor-dev
  - s-eigen
  - s-qt
  - s-embree
  - s-paraview

build-depends:
  - s-cmake

env:
  - set-var TTK_ROOT_DIR $PREFIX
  - add-to-var PATH $PREFIX/bin
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib
  - add-to-var PV_PLUGIN_PATH $PREFIX/bin/plugins
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages

config-options:
  - -DCMAKE_INSTALL_PREFIX=$PREFIX
  - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)
  - -DTTK_BUILD_PARAVIEW_PLUGINS=ON
  - -DTTK_ENABLE_CPU_OPTIMIZATION=OFF
  - -DTTK_ENABLE_EIGEN=ON
  - -DTTK_ENABLE_TORCH=OFF
  - -DCMAKE_INSTALL_LIBDIR:STRING=lib
  - -DBUILD_SHARED_LIBS:BOOL=ON
  - -DTTK_BUILD_STANDALONE_APPS:BOOL=FALSE
  - -DCMAKE_INSTALL_LIBDIR:PATH=lib
  - -DTTK_ENABLE_KAMIKAZE:BOOL=TRUE
  - -DTTK_ENABLE_CPU_OPTIMIZATION:BOOL=FALSE
  - -DTTK_ENABLE_DOUBLE_TEMPLATING:BOOL=OFF
  - -DTTK_ENABLE_EIGEN:BOOL=ON
  - -DTTK_ENABLE_EMBREE:BOOL=ON
  - -DTTK_ENABLE_GRAPHVIZ:BOOL=ON
  - -DTTK_ENABLE_OPENMP:BOOL=ON
  - -DTTK_ENABLE_MPI:BOOL=ON
  - -DTTK_ENABLE_SCIKIT_LEARN:BOOL=OFF
  - -DTTK_ENABLE_ZFP:BOOL=OFF
  - -DTTK_WHITELIST_MODE:BOOL=TRUE
  - -DVTK_MODULE_ENABLE_ttkAlgorithm:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkTriangulationAlgorithm:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkProgramBase:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkHelloWorld:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkTriangulationManager:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkTriangulationRequest:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkArrayEditor:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkArrayPreconditioning:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkBlockAggregator:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkExtract:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkFlattenMultiBlock:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkForEach:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkEndFor:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkGridLayout:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkIcosphere:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkIcosphereFromObject:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkIcospheresFromPoints:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkIdentifierRandomizer:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkIdentifyByScalarField:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkPeriodicGhostsGeneration:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkPointDataSelector:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkScalarFieldNormalizer:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkScalarFieldSmoother:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkTextureMapFromField:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkContinuousScatterPlot:STRING=YES
