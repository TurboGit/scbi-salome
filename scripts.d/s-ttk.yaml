  - -DVTK_MODULE_ENABLE_ttkProjectionFromTable:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkTableDataSelector:STRING=YES
  - -DVTK_MODULE_ENABLE_ttkTableDistanceMatrix:STRING=YES

config: |-
  OPTIONS = config-options
  cmake $OPTIONS ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
