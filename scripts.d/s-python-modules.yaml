  gitpython:
    - s-python3-gitpython
  lark:
    - s-python3-lark
  lxml:
    - s-python3-lxml
  matplotlib:
    - s-python3-matplotlib
  meshio:
    - s-python3-meshio
  metadata:
    - s-python3-importlib-metadata
  msgpack:
    - s-python3-msgpack
  nlopt:
    - s-python3-nlopt
  numexpr:
    - s-python3-numexpr
  numpy:
    - s-python3-numpy
  pyaml:
    - s-python3-yaml
  pyperclip:
    - s-python3-pyperclip
  pyproj:
    - s-python3-proj
  pytidylib:
    - s-python3-pytidylib
  scipy:
    - s-python3-scipy
  smmap:
    - s-python3-smmap
  statsmodels:
    - s-python3-statsmodels
  telemac:
    - s-python3-telemac
  toml:
    - s-python3-toml
  wand:
    - s-python3-wand
  xlutils:
    - s-python3-xlutils

aggregate: recursive

prefix: NONE
