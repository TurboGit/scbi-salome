plugin: s-python-modules

variants:
  core:
    - wand
    - pyaml
    - toml
    - metadata
    - xlutils
    - lxml
    - matplotlib
    - numpy
    - scipy
    - nlopt
    - fmpy
    - buildingspy
    - lark
    - msgpack
    - gitdb
    - gitpython
    - pytidylib
    - smmap
    - statsmodels
    - pyperclip # for PyCD (? Add only when Carmel Study is built)
    - numexpr # for PyCD

modules:
