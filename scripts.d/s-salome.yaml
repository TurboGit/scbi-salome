propagate-version: no

external-env:
  - A
  - $(is-enabled application)
  - I
  - $(is-enabled installer)
  - L
  - $(is-enabled logger)
  - Z
  - $(is-enabled zip)
  - X
  - $(is-enabled xz)

wrapup: |-
  APPDIR = $TARGET-$VARIANT/app
  #  Clean-up previous installation if any
  rm -f $APPDIR/*
  rm -fr $APPDIR/artifacts
  mkdir -p $APPDIR
  cd $APPDIR
  if enabled(application) or enabled(installer):
      log 1 salome prepare the application directory
      #  Add some build artifacts for traceability
      mkdir -p artifacts
      copy ../logs/build-plan artifacts
      date > artifacts/creation-time.txt
      scbi --version > artifacts/scbi_versions.txt
      if not empty($CI_JOB_NAME):
          echo CI_JOB_NAME $CI_JOB_NAME >> artifacts/gitlab-ci.data
      if not empty($CI_PIPELINE_ID):
          echo CI_PIPELINE_ID $CI_PIPELINE_ID >> artifacts/gitlab-ci.data
      #  Copy EDF's modules into sub-directory EDF
      copy-modules-salome
      log 1 salome setup application environment
      setup-env-salome $PREFIX $TARGET $VARIANT
      #  install some support scripts & patch version
      copy $SCBI_PLUGINS/support/icon.png .
      copy $SCBI_PLUGINS/support/salome_template.desktop .
      copy $SCBI_PLUGINS/support/env_launch.sh .
      copy EDF/s-salome-kernel/bin/salome/appli/.bashrc EDF/s-salome-kernel
      KERNEL_PYTHON = EDF/s-salome-kernel/lib/python$PYTHON_VERSION
      if is-dir($KERNEL_PYTHON/site-packages/salome/salome/kernel):
          copy $SCBI_PLUGINS/support/salome-new-python-layout salome
      else:
          copy $SCBI_PLUGINS/support/salome .
      chmod a+x salome env_launch.sh
      #  is the installer to be created?
      if enabled(installer) or enabled(zip):
          if enabled(zip):
              log 1 salome generate zip archive, may take some time ...
              ZIP = command-path zip
              if empty($ZIP):
                  log 1 salome required tool zip missing
                  return 1
          else:
              log 1 salome generate self installer, may take some time ...
              MAKESELF = command-path makeself
              if empty($MAKESELF):
                  log 1 salome required tool makeself missing
                  return 1
          #  create the .run auto-installer to be distributed
          sed "s,__SALOMEVERSION__,$SALOME_PREREQUIS_VERSION,g" $SCBI_PLUGINS/support/install-setup > setup
          copy $SCBI_PLUGINS/support/install-setup-common .
          chmod a+x setup
          copy $SCBI_PLUGINS/support/servers.pvsc .
          #  Startup Windows script to fix Python path to get access to
          #  PyQt needed by the logger start script.
          if $SCBI_IS_WINDOWS == yes:
              copy $SCBI_PLUGINS/support/setup_windows.bat $SCBI_PLUGINS/support/run_mesa_salome.bat $SCBI_PLUGINS/support/run_paraview.bat $SCBI_PLUGINS/support/run_persalys.bat $SCBI_PLUGINS/support/run_salome.bat $SCBI_PLUGINS/support/run_salome_shell.bat .
          cd $SCBI_BDIR/s-salome
          REF = get-version
          SCRIPT_NAME = salome-$TARGET-$VARIANT
          if kind == DEV:
              SCRIPT_NAME = $SCRIPT_NAME-DEV
          elif kind == BRANCH or kind == VERSION:
              SCRIPT_NAME = $SCRIPT_NAME-$REF
          #  -xz compress 40% more but is slow to compress
          if enabled(xz):
              O_COMPRESS = --xz
          else:
              O_COMPRESS = --bzip2
          if enabled(zip):
              rm -f $SCRIPT_NAME.zip salome-$REF
              if $SCBI_IS_WINDOWS == yes:
                  ln -s $APPDIR salome-$REF
                  zip -9r $SCRIPT_NAME.zip salome-$REF
                  rm -f salome-$REF
              else:
                  zip -9r $SCRIPT_NAME.zip $APPDIR
          else:
              #  Use the GNU tar format to ensure that filenames with more
              #  than 100 characters are properly handled. Note that this
              #  option was the default up to Debian-11 and as been switched
              #  to ustar POSIX standard in Debian-12 for compatibility
              #  reasons. But the ustar format has restriction on filename
              #  length.
              MS_OPTS = $O_COMPRESS --tar-quietly
              if $SCBI_OS_MAJOR_VERSION >= 12:
                  MS_OPTS = $MS_OPTS --tar-format gnu
              makeself $MS_OPTS $APPDIR $SCRIPT_NAME.run "SALOME Application" ./setup
