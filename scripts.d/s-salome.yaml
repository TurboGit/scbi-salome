plugin: s-salome

functions:
  copy-modules-salome:
    run: |-
      mkdir EDF
      rm -f artifacts/source-refs.txt
      #  Record source reference for QA
      #  (nothing for aggregated modules, build dependencies and
      #  meta-modules, except aggregates)
      for M in $(all-modules):
          if depends-kind($M) == default and not is-aggregated($M) and (is-aggregate($M) or not is-meta($M)):
              SREF = $SCBI_BDIR/$M/source-ref
              if is-file($SREF):
                  awk '{ r = $5; for (i = 6; i <= NF; i++) r = r " " $i; printf "%-25s %-11s %-20s %-9s %s\n", $1, $2, $3, $4, r }' $SREF >> artifacts/source-refs.txt
  setup-env-salome:
    params:
      - PREFIX
      - TARGET
      - VARIANT
    run: |-
      SBINDIR = EDF/s-salome-kernel
      #  Patch env_launch.sh to be able to call the extra.env.d/*.sh from
      #  env_launch.sh
      append-raw env_launch.sh:
          while read F; do
              source $F
          done < <(find $out_dir_Path/extra.env.d/ -type f -name "[0-9]*.sh" | sort -V)
      #  The directory where the environment files are stored
      mkdir -p extra.env.d
      SVER = get-version
      SVAR = $VARIANT
      #  Override some possible values
      write extra.env.d/0000_setup.py:
          import os.path

          def init(context, root_dir):
             context.setVariable(r"ROOT_SALOME_INSTALL", root_dir, overwrite=True)
             context.setVariable(r"SALOME_VERSION", "$SVER", overwrite=True)
             context.setVariable(r"SALOME_VARIANT", "$SVAR", overwrite=True)
             context.setVariable(r"PYTHON_VERSION", "$PYTHON_VERSION", overwrite=True)
             context.setVariable(r"PYTHONIOENCODING", r"UTF_8", overwrite=True)
             context.setVariable(r"SALOME_ON_DEMAND", r"HIDE", overwrite=True)
      #  The functions used by the environment scripts of the modules
      #  (extra.env.d/NNNN_<module>.sh, written by .env-shared.py)
      write-raw extra.env.d/0000_setup.sh:
            function is-in-list()
            {
                local -n LIST=$1
                local VALUE=$2

                printf -v SL "%s|" ${LIST[*]}
                SL=${SL%?}

                [[ $VALUE = @($SL) ]]
            }
            function remove-from-list()
            {
                local -n LIST=$1
                local VALUE=$2

                for i in ${!LIST[@]}; do
                    [[ ${LIST[$i]} == $VALUE ]] && unset LIST[$i]
                done

                true
            }
            function prepend-to-list()
            {
                local -n _LIST=$1
                local VALUE=$2

                remove-from-list _LIST $VALUE
                _LIST=( $VALUE ${_LIST[@]} )
            }
            function append-to-list()
            {
                local -n _LIST=$1
                local VALUE=$2

                remove-from-list _LIST $VALUE
                _LIST+=( $VALUE )
            }
            function add-to-list()
            {
                local -n _LIST=$1
                local VALUE=$2

                ! is-in-list _LIST $VALUE &&
                    _LIST=( $VALUE ${_LIST[@]} )

                true
            }
            function remove-from-var-sep()
            {
                local -n _VAR=$1
                local VALUE=$2
                local SEP=$3

                local p_LIST=( ${_VAR//$SEP/ } )
                remove-from-list p_LIST $VALUE
                printf -v _VAR "%s$SEP" ${p_LIST[@]}
                _VAR=${_VAR%?}
            }
            function prepend-to-var-sep()
            {
                local -n _VAR=$1
                local VALUE=$2
                local SEP=$3

                local p_LIST=( ${_VAR//$SEP/ } )
                prepend-to-list p_LIST $VALUE
                printf -v _VAR "%s$SEP" ${p_LIST[@]}
                _VAR=${_VAR%?}
            }
            function append-to-var-sep()
            {
                local -n _VAR=$1
                local VALUE=$2
                local SEP=$3

                local p_LIST=( ${_VAR//$SEP/ } )
                append-to-list p_LIST $VALUE
                printf -v _VAR "%s$SEP" ${p_LIST[@]}
                _VAR=${_VAR%?}
            }
            function add-to-var-sep()
            {
                local -n _VAR=$1
                local VALUE=$2
                local SEP=$3

                local p_LIST=( ${_VAR//$SEP/ } )
                add-to-list p_LIST $VALUE
                printf -v _VAR "%s$SEP" ${p_LIST[@]}
                _VAR=${_VAR%?}
            }
      append extra.env.d/0000_setup.sh:
          export ROOT_SALOME_INSTALL=\${out_dir_Path}
          export SALOME_VERSION=$SVER
          export SALOME_VARIANT=$SVAR
          export PYTHON_VERSION=$PYTHON_VERSION
          export SALOME_ON_DEMAND=HIDE
          export PYTHONIOENCODING=UTF_8
      #  The tests of the modules (ctest-dir hook)
      CTESTFILE = $SBINDIR/bin/salome/test/CTestTestfile.cmake
      #  (no environment for aggregated modules, build dependencies and
      #  meta-modules, except aggregates)
      for M in $(all-modules):
          if depends-kind($M) == default and not is-aggregated($M) and (is-aggregate($M) or not is-meta($M)):
              #  an aggregate module: the tests of its modules
              MODS = $M
              if is-aggregate($M):
                  MODS = hook-output $M modules
              for S in $MODS:
                  DIR = hook-output $S ctest-dir EDF/$M
                  if not empty($DIR):
                      LINE = "SUBDIRS(../../../../../$DIR)"
                      if not ok("grep -q -F -x \"$LINE\" $CTESTFILE"):
                          echo $LINE >> $CTESTFILE

