plugin: s-adao-tool

functions:
  s-adao-tool-ctest-dir:
    params:
      - PREFIX
    run: echo $PREFIX/bin/salome/test

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/SalomePlatform/adao

depends:
  common:
    - s-salome-configuration
  default:
    - os@-python3-sphinx-rtd-theme
    - os@-python3-matplotlib
    - s-python3-nlopt
    - os@-python3-scipy

build-depends:
  - s-cmake
  - if not enabled(no-doc): os@-sphinx-common
  - if not enabled(no-doc): os@-sphinx-intl

env:
  - set-var ADAO_ENGINE_ROOT_DIR $PREFIX
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib
  - add-to-var PYTHONPATH $PREFIX/lib/python$PYTHON_VERSION/site-packages

build-env:
  - set-var CURRENT_SOFTWARE_INSTALL_DIR $PREFIX

config-options:
  - PyPATH = $(command-path python$PYTHON_VERSION)
  - if enabled(no-doc) -DADAO_BUILD_DOC=OFF
  - if enabled(cmake-debug) -DSALOME_CMAKE_DEBUG=ON
  - -DCMAKE_INSTALL_PREFIX=$PREFIX
  - -DPYTHON_EXECUTABLE=$PyPATH
  - -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release)
  - -DADAO_SALOME_MODULE=OFF

config: cmake $(config-options) ../src

build: make -j$SCBI_JOBS

install: make install

prefix: NONE
